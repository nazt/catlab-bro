# Prebuilt Home Assistant add-on image, per architecture, pushed to GHCR as the add-on's
# config.yaml `image:` names it: ghcr.io/<owner>/{arch}-addon-<slug>:<version> (and :latest).
# Home Assistant then pulls it instead of building on the device.
#
# Runs only when config.yaml has an `image:` line for THIS repository's owner. The init workflow
# adds that line in public repositories (scripts/ha-buttons.sh --image) and starts this workflow.
# Every push that changes the backend becomes a new version Home Assistant can offer: if
# config.yaml's `version:` is already published, the `version` job bumps the patch number, adds a
# CHANGELOG line with the commit subject, and commits that (as github-actions) before building.
# The image records the commit it was built from (GIT_SHA), which the panel shows.
#
# GHCR packages start PRIVATE, even from a public repository, and Supervisor pulls anonymously:
# after the first run, open the two packages (Your profile/org -> Packages) -> Package settings ->
# Change visibility -> Public. The API cannot do this step.
name: addon-image

on:
  push:
    branches: [main]
    paths:
      - "pocketbase/**"
      - "addon/**"
      - "project.env"
      - ".github/workflows/addon-image.yml"
  workflow_dispatch:

permissions:
  contents: write   # the version job commits the bump
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: bump
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          slug=$(sed -n 's/^ADDON_SLUG=//p' project.env)
          cfg="addon/$slug/config.yaml"
          image=$(sed -n 's/^image: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$cfg")
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$cfg")
          msg=""

          # 1. The add-on's copy of pocketbase/ is generated. A commit from GitHub's web editor (the
          #    panel's "Commit to repo") cannot run sync-addon.sh, so sync it here, before any build.
          scripts/sync-addon.sh
          [ -z "$(git status --porcelain)" ] || msg="Sync the add-on copy of pocketbase/"

          # 2. Already published at this version? Then this push is a new version: bump the patch.
          published=no
          if [ -n "$image" ]; then
            repo="${image#ghcr.io/}"; repo="${repo/\{arch\}/amd64}"
            tok=$(curl -s "https://ghcr.io/token?scope=repository:${repo}:pull" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))' || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${repo}/manifests/${version}" || true)
            [ "$code" = 200 ] && published=yes
          fi
          if [ "$published" = yes ]; then
            next=$(echo "$version" | awk -F. -v OFS=. '{$NF=$NF+1; print}')
            sed -i "s/^version: .*/version: \"$next\"/" "$cfg"
            subject=$(printf '%s' "${SUBJECT:-update}" | head -n1)
            python3 - "addon/$slug/CHANGELOG.md" "$next" "$subject" "$(git rev-parse --short HEAD)" <<'PY2'
          import os, sys
          path, ver, subj, sha = sys.argv[1:]
          s = open(path).read() if os.path.exists(path) else "# Changelog\n\n"
          head, _, rest = s.partition("\n\n")
          open(path, "w").write(f"{head}\n\n## {ver}\n\n- {subj} ({sha})\n\n{rest}")
          PY2
            msg="Release $next (automatic: $version was already published)"
          fi

          # 3. Commit (bot; pushes made with this token start no workflows) and build that commit.
          if [ -n "$msg" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A addon pocketbase && git commit -qm "$msg"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
            echo "$msg"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - id: v
        env:
          OWNER: ${{ github.repository_owner }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          slug=$(sed -n 's/^ADDON_SLUG=//p' project.env)
          cfg="addon/$slug/config.yaml"
          image=$(sed -n 's/^image: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$cfg")
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ -z "$image" ]; then
            echo "::notice::$cfg has no image: line, Home Assistant builds on the device; nothing to push"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(echo "$image" | cut -d/ -f2)" != "$owner" ]; then
            echo "::notice::image $image belongs to another account (the init workflow re-points it)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$PRIVATE" = "true" ]; then
            echo "::warning::private repository: Supervisor cannot pull anonymously; remove image: from $cfg or make the repo public"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "context=addon/$slug" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$cfg")" >> "$GITHUB_OUTPUT"
          echo "image=${image/\{arch\}/${{ matrix.arch }}}" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.v.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.v.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.v.outputs.context }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ needs.version.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
          push: true
          provenance: false
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - if: steps.v.outputs.skip != 'true'
        name: Can Home Assistant pull it?
        run: |
          img="${{ steps.v.outputs.image }}"; repo="${img#ghcr.io/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://ghcr.io/token?scope=repository:${repo}:pull")
          if [ "$code" = "200" ]; then echo "public: Supervisor can pull $img"
          else echo "::warning::$img is PRIVATE (token endpoint $code). Make the package public once: Packages -> $repo -> Package settings -> Change visibility -> Public"; fi
