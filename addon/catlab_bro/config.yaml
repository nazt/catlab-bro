name: Catlab Bro
version: "0.1.2"
image: "ghcr.io/nazt/{arch}-addon-catlab-bro"
slug: catlab_bro
description: PocketBase backend for Catlab Bro
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# Sidebar panel through ingress: the landing page (pocketbase/pb_public) signs a Home Assistant
# user in to the dashboard (auto_login) and opens it; every URL is relative, so it works under
# the ingress prefix. The port stays published for apps and devices that use the API.
ingress: true
ingress_port: 8090
panel_icon: mdi:database
panel_title: Catlab Bro
watchdog: http://[HOST]:[PORT:8090]/api/health
ports:
  8090/tcp: 8277
ports_description:
  8090/tcp: PocketBase API, realtime and admin UI (/_/)
webui: http://[HOST]:[PORT:8090]/_/
# pb_data and the generated credentials live in /data (persistent, included in backups).
backup: hot
options:
  admin_email: admin@example.invalid
  app_email: app@example.invalid
  auto_login: true
  ha_user_ids: ""
schema:
  admin_email: email
  app_email: email
  public_url: url?
  # Signed in to Home Assistant -> signed in to the dashboard as admin_email, from the sidebar
  # panel only (trusted only from Supervisor's ingress proxy, never through the published port).
  auto_login: bool
  # Optional: comma-separated Home Assistant user ids allowed to auto-login (empty: any).
  ha_user_ids: str?
